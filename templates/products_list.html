<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог игр | GameStore</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h2 {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 40px 30px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px 0;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }

        .product-card .image-wrapper {
            position: relative;
            overflow: hidden;
            height: 200px;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover img {
            transform: scale(1.1);
        }

        .product-card .no-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 4em;
        }

        .product-info {
            padding: 20px;
        }

        .product-card h3 {
            margin-bottom: 15px;
        }

        .product-card h3 a {
            color: #333;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: 600;
            transition: color 0.3s ease;
            line-height: 1.4;
        }

        .product-card h3 a:hover {
            color: #667eea;
        }

        .price {
            font-size: 1.5em;
            font-weight: 700;
            color: #764ba2;
            margin-bottom: 10px;
        }

        .genre {
            display: inline-block;
            background: #f0f0f0;
            color: #667eea;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        .btn-add {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .btn-add:active {
            transform: translateY(0);
        }

        .empty-catalog {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-catalog .empty-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        .empty-catalog h3 {
            font-size: 1.8em;
            margin-bottom: 10px;
            color: #666;
        }

        .empty-catalog p {
            font-size: 1.1em;
        }

        /* Анимация появления карточек */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-card:nth-child(1) { animation-delay: 0.1s; }
        .product-card:nth-child(2) { animation-delay: 0.2s; }
        .product-card:nth-child(3) { animation-delay: 0.3s; }
        .product-card:nth-child(4) { animation-delay: 0.4s; }
        .product-card:nth-child(5) { animation-delay: 0.5s; }
        .product-card:nth-child(6) { animation-delay: 0.6s; }
        .product-card:nth-child(7) { animation-delay: 0.7s; }
        .product-card:nth-child(8) { animation-delay: 0.8s; }

        /* Бейдж новинки (опционально) */
        .badge-new {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff4757;
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 0.8em;
            z-index: 1;
            box-shadow: 0 3px 10px rgba(255, 71, 87, 0.3);
        }

        /* Мобильная версия */
        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 15px;
            }

            .header {
                padding: 30px 20px;
            }

            .header h2 {
                font-size: 2em;
            }

            .content {
                padding: 30px 20px;
            }

            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 20px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 10px;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .product-card h3 a {
                font-size: 1.1em;
            }

            .price {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🎮 Наши товары</h2>
            <p>Выберите игры для своей коллекции</p>
        </div>

        <div class="content">
            {% if games %}
                <div class="product-grid">
                    {% for game in games %}
                    <div class="product-card">
                        <div class="image-wrapper">
                            {% if game.image %}
                                <img src="{{ game.image.url }}" alt="{{ game.name }}">
                            {% else %}
                                <div class="no-image">🎮</div>
                            {% endif %}
                            <!-- Опционально: бейдж новинки -->
                            <!-- <span class="badge-new">NEW</span> -->
                        </div>

                        <div class="product-info">
                            <h3>
                                <a href="{% url 'product_card' game_id=game.id %}">
                                    {{ game.name }}
                                </a>
                            </h3>
                            <p class="price">{{ game.price }} ₽</p>
                            <p>
                                <span class="genre">🏷 {{ game.genre }}</span>
                            </p>

                            <form method="post" action="{% url 'add_to_cart' game.id %}">
                                {% csrf_token %}
                                <button type="submit" class="btn-add">
                                    🛒 Добавить в корзину
                                </button>
                            </form>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            {% else %}
                <div class="empty-catalog">
                    <div class="empty-icon">🎮</div>
                    <h3>Каталог пуст</h3>
                    <p>Новые игры появятся совсем скоро!</p>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
