<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GameStore</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .container h1 {
            font-size: 2em;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .container h1:hover {
            transform: scale(1.05);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        nav {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1em;
            padding: 10px 20px;
            border-radius: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        nav a::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
            border-radius: 25px;
        }

        nav a:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* Иконки для ссылок */
        nav a[href*="profile"]::before,
        nav a[href*="profile"]:hover::before {
            /* Специфичные стили если нужны */
        }

        .cart-count {
            background: #ff4757;
            color: white;
            padding: 2px 8px;
            border-radius: 50%;
            font-size: 0.8em;
            margin-left: 5px;
            font-weight: bold;
        }

        /* Мобильная версия */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                gap: 15px;
                padding: 15px 20px;
            }

            .container h1 {
                font-size: 1.5em;
            }

            nav {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            nav a {
                padding: 8px 15px;
                font-size: 1em;
            }
        }

        /* Для очень маленьких экранов */
        @media (max-width: 480px) {
            nav {
                flex-direction: column;
                gap: 10px;
                width: 100%;
            }

            nav a {
                text-align: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 GamesStor</h1>
        <nav>
            <a href="{% url 'profile' %}">👤 Профиль</a>
            <a href="{% url 'shopping_cart' %}">
                🛒 Корзина
                {% if cart_count > 0 %}
                    <span class="cart-count">{{ cart_count }}</span>
                {% endif %}
            </a>
        </nav>
    </div>

    <!-- Здесь будет основной контент страницы -->
    <div style="padding: 20px; color: white; text-align: center;">
        <!-- Контент -->
    </div>
</body>
</html>
